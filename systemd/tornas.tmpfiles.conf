# systemd-tmpfiles: state, config and log directories with correct ownership.
# Install to /usr/lib/tmpfiles.d/tornas.conf
d /var/lib/tornas 0750 tornas tornas -
d /var/lib/tornas/torrents 0750 tornas tornas -
d /etc/tornas 0750 root tornas -
z /etc/tornas/config.toml 0644 root root -
z /etc/tornas/tornas.env 0640 root tornas -
d /var/log/tornas 0750 tornas tornas -
