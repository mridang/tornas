[package]
name = "tornas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Single-binary home media center: torrent client, Stremio addon, DLNA server, LRU disk budget"
publish = false

[[bin]]
name = "tornas"
path = "src/main.rs"

[dependencies]
# Torrent engine. default-features off avoids OpenSSL; rust-tls uses rustls + aws-lc-rs which
# cross-compiles statically to every musl target we ship (verified for aarch64 and armv7).
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "002a348", default-features = false, features = ["rust-tls", "upnp-serve-adapter"] }
upnp-serve = { package = "librqbit-upnp-serve", git = "https://github.com/ikatson/rqbit", rev = "002a348" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = { version = "0.8", features = ["json", "http1"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-journald = "0.3"
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic", "metrics", "logs", "trace"] }
opentelemetry-prometheus = "0.29"
opentelemetry-appender-tracing = "0.29"
tracing-opentelemetry = "0.30"
prometheus = "0.14"
nix = { version = "0.30", features = ["fs"] }
mime_guess = { version = "2", default-features = false }
parking_lot = "0.12"
ratatui = "0.30"
crossterm = "0.29"
rand = "0.9"
gethostname = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
url = "2"
ipnet = "2"
serde_ignored = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.9"
base64 = "0.22"
humantime-serde = "1"
mdns-sd = "0.21"
sd-notify = "0.5"
sha1w = { package = "librqbit-sha1-wrapper", git = "https://github.com/ikatson/rqbit", rev = "002a348", default-features = false, features = ["sha1-ring"] }

[dev-dependencies]
tempfile = "3"

# `cargo deb --no-build --target <triple>` packages the cargo-zigbuild binary.
[package.metadata.deb]
name = "tornas"
maintainer = "Mridang Agarwalla <mridang.agarwalla@gmail.com>"
copyright = "2026, Mridang Agarwalla"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Single static binary that downloads movies over BitTorrent, serves them to \
Stremio and DLNA players, fetches TMDB metadata, and evicts the least \
recently watched titles to stay under a configured disk budget."""
section = "video"
priority = "optional"
depends = "ca-certificates"
recommends = "systemd"
maintainer-scripts = "../../packaging/debian"
conf-files = ["/etc/tornas/config.toml", "/etc/tornas/tornas.env"]
assets = [
    ["target/release/tornas", "usr/bin/tornas", "755"],
    ["../../systemd/tornas.service", "lib/systemd/system/tornas.service", "644"],
    ["../../systemd/tornas.sysusers.conf", "usr/lib/sysusers.d/tornas.conf", "644"],
    ["../../systemd/tornas.tmpfiles.conf", "usr/lib/tmpfiles.d/tornas.conf", "644"],
    ["../../config.example.toml", "etc/tornas/config.toml", "644"],
    ["../../systemd/tornas.env.example", "etc/tornas/tornas.env", "640"],
    ["../../README.md", "usr/share/doc/tornas/README.md", "644"],
]
