name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  pages: write

defaults:
  run:
    working-directory: ./

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      # tornas is a Rust workspace: scripts/set-version.sh runs `cargo update`
      # on the runner during semantic-release's prepare step, so cargo must be
      # present. (semantic-release-cargo is not used: its verify step rejects
      # git dependencies without a version, such as librqbit.) The image itself
      # is built inside the Dockerfile via
      # cargo-zigbuild, which carries its own toolchain (no cross target or
      # musl linker needed here, and no QEMU — zigbuild cross-compiles).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Multi-platform `docker buildx build` (run internally by
      # @mridang/semantic-release-oci) needs a container-driver builder; the
      # default docker driver cannot emit a multi-arch manifest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run semantic-release
        uses: mridang/action-semantic-release@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # @mridang/semantic-release-oci performs `docker login` itself using
          # these; no separate docker/login-action step is needed.
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- apt repository on GitHub Pages --------------------------------
      # semantic-release's bake step leaves dist/<platform>/tornas.deb behind
      # when a release was cut. Merge them into the existing pool on the
      # gh-pages branch, regenerate the indexes, sign, and push.
      - name: Check for new packages
        id: debs
        run: |
          if ls dist/*/tornas.deb >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout existing repository
        if: steps.debs.outputs.found == 'true'
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - name: Import apt signing key
        if: steps.debs.outputs.found == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}' > /tmp/keyid

      - name: Build apt repository
        if: steps.debs.outputs.found == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/build-apt-repo.sh dist site "$(cat /tmp/keyid)"

      - name: Publish to gh-pages
        if: steps.debs.outputs.found == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: mridang
          user_email: mridang.agarwalla@gmail.com
          commit_message: "chore(apt): publish packages"
