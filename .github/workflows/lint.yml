name: Lint Code
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  code-linting:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The protocol modules are self-contained on purpose: each defines what it
      # needs from the application rather than reaching into it. See
      # docs/ARCHITECTURE.md.
      - name: Protocol modules stay independent
        run: |
          cd crates/tornas/src
          # Self-references (crate::stremio::… from inside stremio) are fine; a
          # reference to any other module is not.
          if grep -rn 'crate::' stremio stremio.rs dlna dlna.rs mdns.rs service \
              | grep -v 'crate::stremio::' | grep -v 'crate::dlna::' \
              | grep -v 'crate::service::'; then
            echo "::error::stremio, dlna, mdns and service must not import from this crate"
            exit 1
          fi
