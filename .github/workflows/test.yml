name: Run Tests
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  app-testing:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          key: tests

      # aws-lc-sys (rustls crypto) builds C code with cmake.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Run Tests
        run: cargo test --workspace --locked

  systemd-install:
    name: Install and run under systemd
    runs-on: ubuntu-24.04
    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          key: systemd

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build the package
        run: |
          cargo build --release --locked -p tornas
          cargo install cargo-deb --locked
          cargo deb --no-build -p tornas -o tornas.deb

      # The runner is a real VM with systemd as PID 1: install the .deb, then
      # start, reload, pull the data disk, plug it back, stop and purge.
      - name: Smoke test under systemd
        run: sudo scripts/ci/systemd-smoke.sh tornas.deb
